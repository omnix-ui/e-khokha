<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>E-KHOKHA Admin Login</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>
<div class="login-page">
<div class="login-card">
<div class="login-brand">E-KHOKHA<span>ADMIN PANEL</span></div>
<h1>Admin Login</h1>
<p class="login-subtitle">Sign in to manage your store</p>
<form id="adminLoginForm">
<label for="email">Admin Email</label>
<input type="email" id="email" placeholder="Enter admin email" autocomplete="email" required>
<label for="password">Password</label>
<input type="password" id="password" placeholder="Enter password" autocomplete="current-password" required>
<button type="submit" id="loginBtn">Login</button>
<p id="loginMessage" class="login-message"></p>
</form>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>
<script src="admin.js"></script>
</body>
</html>
