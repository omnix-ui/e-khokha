<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Reset Password - E-KHOKHA</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
<link rel="stylesheet" href="../css/style.css">
</head>

<body>

<main class="auth-page">
    <div class="auth-card">

        <div class="auth-brand">
            <h1>E-KHOKHA</h1>
            <p>Create a new password</p>
        </div>

        <form id="reset-password-form">

            <div class="auth-field">
                <label for="reset-password">New Password</label>

                <div class="password-wrap">
                    <input
                        type="password"
                        id="reset-password"
                        placeholder="Enter new password"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >

                    <button type="button" id="toggle-reset-password" class="password-toggle" aria-label="Show password">
                        <span class="material-symbols-outlined">visibility</span>
                    </button>
                </div>

                <div class="password-hint">
                    Use at least 8 characters.
                </div>
            </div>

            <div class="auth-field">
                <label for="reset-confirm-password">Confirm New Password</label>

                <div class="password-wrap">
                    <input
                        type="password"
                        id="reset-confirm-password"
                        placeholder="Re-enter new password"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >

                    <button type="button" id="toggle-reset-confirm-password" class="password-toggle" aria-label="Show password">
                        <span class="material-symbols-outlined">visibility</span>
                    </button>
                </div>
            </div>

            <p id="reset-error" class="auth-message error" hidden></p>
            <p id="reset-success" class="auth-message success" hidden></p>

            <button type="submit" id="reset-submit" class="auth-submit">
                Update Password
            </button>

        </form>

        <p class="auth-switch" style="margin-top:22px;">
            Remember your password?
            <a href="login.html" id="back-to-login">Login</a>
        </p>

    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>
<script src="../js/auth.js"></script>

</body>
</html>
