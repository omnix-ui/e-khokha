<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Saved Addresses - E-KHOKHA</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/account.css">
</head>
<body>

<header class="top-header">
    <a href="#" onclick="window.history.back();return false;" class="header-icon">
        <span class="material-symbols-outlined">arrow_back</span>
    </a>
    <div class="header-title" style="font-weight:700;color:#1a1a1a;">Saved Addresses</div>
    <div class="header-icon" style="opacity:0;">
        <span class="material-symbols-outlined">settings</span>
    </div>
</header>

<main class="account-main address-main">
    <div id="address-loader" class="account-loader">
        <div class="loader-spinner"></div>
        <p>Loading addresses...</p>
    </div>

    <section id="address-content" style="display:none;">
        <div class="address-page-top">
            <div>
                <h2>My Addresses</h2>
                <p>Manage your saved delivery addresses</p>
            </div>
            <button id="add-address-btn" class="address-add-btn" type="button">
                <span class="material-symbols-outlined">add</span>
                <span>Add Address</span>
            </button>
        </div>

        <div id="address-list" class="address-list"></div>

        <div id="no-address" class="no-address" style="display:none;">
            <span class="material-symbols-outlined no-address-icon">location_on</span>
            <h3>No saved addresses</h3>
            <p>Add an address for faster checkout.</p>
            <button id="empty-add-address" type="button">Add Address</button>
        </div>
    </section>
</main>

<div id="address-modal" class="profile-modal" style="display:none;">
    <div class="profile-modal-box address-modal-box">
        <div class="profile-modal-header">
            <h3 id="address-modal-title">Add Address</h3>
            <button type="button" id="close-address-modal">×</button>
        </div>

        <form id="address-form">
            <input type="hidden" id="address-id">

            <div class="address-form-grid">
                <div class="profile-form-field">
                    <label for="address-name">Full Name</label>
                    <input type="text" id="address-name" minlength="2" required>
                </div>
                <div class="profile-form-field">
                    <label for="address-mobile">Mobile Number</label>
                    <input type="tel" id="address-mobile" inputmode="numeric" maxlength="10" required>
                </div>
                <div class="profile-form-field address-full">
                    <label for="address-house">House / Flat / Building</label>
                    <input type="text" id="address-house" required>
                </div>
                <div class="profile-form-field address-full">
                    <label for="address-street">Street / Area</label>
                    <input type="text" id="address-street" required>
                </div>
                <div class="profile-form-field">
                    <label for="address-city">City</label>
                    <input type="text" id="address-city" required>
                </div>
                <div class="profile-form-field">
                    <label for="address-state">State</label>
                    <input type="text" id="address-state" required>
                </div>
                <div class="profile-form-field">
                    <label for="address-pincode">Pincode</label>
                    <input type="text" id="address-pincode" inputmode="numeric" maxlength="6" required>
                </div>
            </div>

            <label class="address-default-check">
                <input type="checkbox" id="address-default">
                <span>Set as default address</span>
            </label>

            <p id="address-form-error" class="profile-edit-message error" hidden></p>
            <p id="address-form-success" class="profile-edit-message success" hidden></p>

            <div class="profile-modal-actions">
                <button type="button" id="cancel-address">Cancel</button>
                <button type="submit" id="save-address-btn">Save Address</button>
            </div>
        </form>
    </div>
</div>

<nav class="bottom-nav">
    <a href="../index.html" class="nav-item">
        <span class="material-symbols-outlined">home</span>
        <span>Home</span>
    </a>
    <a href="category.html" class="nav-item">
        <span class="material-symbols-outlined">category</span>
        <span>Categories</span>
    </a>
    <a href="cart.html" class="nav-item">
        <span class="material-symbols-outlined">shopping_cart</span>
        <span>Cart</span>
    </a>
    <a href="order.html" class="nav-item">
        <span class="material-symbols-outlined">list_alt</span>
        <span>Order</span>
    </a>
    <a href="account.html" class="nav-item active">
        <span class="material-symbols-outlined">person</span>
        <span>Account</span>
    </a>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>
<script src="../js/address.js"></script>
</body>
</html>
