<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Coupons & Offers - E-KHOKHA</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
<link rel="stylesheet" href="../css/style.css">
<style>
body{background:#f8f9fa;margin:0}
.coupon-main{padding:0px 15px 90px;max-width:760px;margin:auto;box-sizing:border-box}
.coupon-apply-box{background:#fff;border-radius:12px;padding:15px;display:flex;gap:10px;box-shadow:0 2px 8px rgba(0,0,0,.04);margin-bottom:25px}
.coupon-input{flex:1;min-width:0;border:1px solid #dfe6e9;border-radius:8px;padding:10px 15px;font-size:14px;text-transform:uppercase;outline:none;box-sizing:border-box}
.coupon-input:focus{border-color:#fd4f6a}
.coupon-apply-btn{background:#fd4f6a;color:#fff;border:0;border-radius:8px;padding:0 20px;font-weight:600;font-size:14px;cursor:pointer}
.coupon-apply-btn:disabled{opacity:.6;cursor:not-allowed}
.coupon-heading{font-size:16px;margin:0 0 15px;color:#1a1a1a}
.coupon-list{display:flex;flex-direction:column;gap:15px}
.coupon-card{background:#fff;border-radius:12px;padding:15px;box-shadow:0 2px 8px rgba(0,0,0,.04);border-left:4px solid #fd4f6a}
.coupon-card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:10px}
.coupon-code{background:#fff0f2;border:1px dashed #fd4f6a;color:#fd4f6a;padding:4px 8px;border-radius:4px;font-weight:700;font-size:14px;display:inline-block;margin-bottom:8px}
.coupon-off{font-weight:700;font-size:16px;color:#1a1a1a}
.coupon-min{font-size:12px;color:#636e72;margin-top:3px}
.coupon-card-apply{background:transparent;color:#fd4f6a;border:0;font-weight:700;font-size:14px;cursor:pointer;padding:5px 0}
.coupon-divider{border:0;border-top:1px solid #f1f2f6;margin:10px 0}
.coupon-description{font-size:13px;color:#2d3436;margin-bottom:5px;line-height:1.4}
.coupon-expiry{font-size:11px;color:#a4b0be;font-weight:600}
.coupon-empty{text-align:center;padding:35px 20px;background:#fff;border-radius:12px;color:#636e72;font-size:14px}
.coupon-loader{display:flex;align-items:center;justify-content:center;min-height:180px;color:#777;font-size:14px}
.coupon-error{background:#fff0f2;color:#c62828;border-radius:8px;padding:12px;font-size:13px;text-align:center}
.applied-coupon{display:none;background:#e9fff5;border:1px solid #b7efd3;color:#168a42;border-radius:10px;padding:12px;margin-bottom:15px;font-size:13px}
.applied-coupon.show{display:flex;align-items:center;justify-content:space-between;gap:10px}
.remove-coupon{border:0;background:transparent;color:#d63031;font-weight:700;cursor:pointer}
@media(max-width:480px){
.coupon-main{padding-left:12px;padding-right:12px}
.coupon-apply-box{padding:12px}
.coupon-input{padding:10px 11px;font-size:13px}
.coupon-apply-btn{padding:0 15px}
}
</style>
</head>
<body>

<header class="top-header" style="background:#fff;position:fixed;top:0;width:100%;display:flex;align-items:center;justify-content:space-between;padding:15px;box-shadow:0 2px 5px rgba(0,0,0,.05);z-index:100;box-sizing:border-box;">
<a href="#" onclick="window.history.back();return false;" class="header-icon" style="color:#1a1a1a;text-decoration:none;display:flex;">
<span class="material-symbols-outlined">arrow_back</span>
</a>
<div class="header-title" style="font-weight:700;color:#1a1a1a;font-size:18px;">Coupons & Offers</div>
<div class="header-icon" style="width:24px;"></div>
</header>

<main class="coupon-main">

<div id="applied-coupon-box" class="applied-coupon">
<span id="applied-coupon-text"></span>
<button id="remove-coupon-btn" class="remove-coupon">Remove</button>
</div>

<div class="coupon-apply-box">
<input type="text" id="manual-coupon-input" class="coupon-input" placeholder="Enter coupon code" maxlength="50" autocomplete="off">
<button id="manual-apply-btn" class="coupon-apply-btn">Apply</button>
</div>

<h3 class="coupon-heading">Available Coupons</h3>

<div id="available-coupons-container" class="coupon-list">
<div class="coupon-loader">Loading coupons...</div>
</div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>
<script src="../js/app.js"></script>
<script src="../js/coupon.js"></script>
</body>
</html>
