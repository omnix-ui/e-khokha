<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Coupons & Offers - E-KHOKHA</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="../css/style.css">
</head>
<body style="background-color: #f8f9fa;">

    <!-- TOP HEADER -->
    <header class="top-header" style="background: #fff; position: fixed; top: 0; width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); z-index: 100;">
        <a href="#" onclick="window.history.back(); return false;" class="header-icon" style="color: #1a1a1a; text-decoration: none; display: flex;">
            <span class="material-symbols-outlined">arrow_back</span>
        </a>
        <div class="header-title" style="font-weight: 700; color: #1a1a1a; font-size: 18px;">Coupons & Offers</div>
        <div class="header-icon" style="width: 24px;"></div> 
    </header>

    <main style="padding: 0px 15px 30px 15px;">
        
        <!-- APPLY COUPON INPUT BOX -->
        <div style="background: #fff; border-radius: 12px; padding: 15px; display: flex; gap: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); margin-bottom: 25px;">
            <input type="text" id="manual-coupon-input" placeholder="Enter coupon code" style="flex: 1; border: 1px solid #dfe6e9; border-radius: 8px; padding: 10px 15px; font-size: 14px; text-transform: uppercase;">
            <button onclick="handleManualApply()" style="background: #fd4f6a; color: #fff; border: none; border-radius: 8px; padding: 0 20px; font-weight: 600; font-size: 14px; cursor: pointer;">Apply</button>
        </div>

        <h3 style="font-size: 16px; margin-bottom: 15px; color: #1a1a1a;">Available Coupons</h3>

        <!-- AVAILABLE COUPONS LIST -->
        <div id="available-coupons-container" style="display: flex; flex-direction: column; gap: 15px;">
            <!-- JS will inject coupons here -->
        </div>

    </main>

    <!-- Master Data File first, then Logic File -->
    <script src="../js/app.js"></script>
    <script src="../js/coupon.js"></script>
</body>
</html>
