<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Categories - E-KHOKHA</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0" />
    <link rel="stylesheet" href="../css/style.css">
</head>
<body style="background-color: #f8f9fa;">

    <header class="top-header">
  <a href="#" onclick="window.history.back(); return false;" class="header-icon">
            <span class="material-symbols-outlined">arrow_back</span>
        </a>
        <div class="header-title" style="font-weight: 700; color: #1a1a1a;">Categories</div>
        <a href="search.html" class="header-icon">
            <span class="material-symbols-outlined">search</span>
        </a>
    </header>

    <main style="padding-top: 0px; padding-bottom: 80px;">
        <!-- CATEGORY TABS (Reusing your home page styles!) -->
        <div class="categories-section" style="position: sticky; top: 55px; background: #fff; z-index: 10; padding-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.02);">
            <div class="category-list" id="page-category-tabs">
                <!-- Rendered via JS -->
            </div>
        </div>

        <!-- PRODUCTS GRID -->
        <div id="category-products-grid" style="padding: 15px; display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
            <!-- Products injected securely via JS -->
        </div>

        <!-- EMPTY STATE -->
        <div id="category-empty-state" style="display: none; flex-direction: column; align-items: center; justify-content: center; padding: 50px 20px; text-align: center; color: #636e72;">
            <span class="material-symbols-outlined" style="font-size: 60px !important; color: #dfe6e9; margin-bottom: 10px;">inventory_2</span>
            <h3 style="color: #2b2b2b; margin: 0 0 5px 0;">No products found</h3>
            <p style="margin: 0; font-size: 14px;">We are adding new products to this category soon.</p>
        </div>
    </main>

    <!-- BOTTOM NAVIGATION -->
    <nav class="bottom-nav">
        <a href="../index.html" class="nav-item"><span class="material-symbols-outlined">home</span><span>Home</span></a>
        <a href="category.html" class="nav-item active"><span class="material-symbols-outlined">category</span><span>Categories</span></a>
        <a href="cart.html" class="nav-item"><span class="material-symbols-outlined">shopping_cart</span><span>Cart</span></a>
        <a href="order.html" class="nav-item"><span class="material-symbols-outlined">list_alt</span><span>Order</span></a>
        <a href="account.html" class="nav-item"><span class="material-symbols-outlined">person</span><span>Account</span></a>
    </nav>

   <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>
<script src="../js/app.js"></script>
<script src="../js/category.js"></script>
</body>
</html>
