<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Reviews - E-KHOKHA</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0" />
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/review.css">
</head>
<body>

    <!-- HEADER -->
    <header class="top-header">
        <a href="#" onclick="window.history.back(); return false;" class="header-icon">
            <span class="material-symbols-outlined">arrow_back</span>
        </a>
        <div class="header-title" style="font-weight: 700; color: #1a1a1a;">Ratings & Reviews</div>
        <div class="header-icon"></div> <!-- Spacer -->
    </header>

    <main class="review-main">
        <!-- RATING OVERVIEW (Dynamic) -->
        <div class="rating-overview" id="rating-overview-container">
            <!-- Injected via JS -->
        </div>

        <h3 style="font-size: 16px; margin-bottom: 15px; color: #1a1a1a;">Customer Reviews</h3>

        <!-- REVIEWS LIST (Dynamic) -->
        <div id="reviews-list-container">
            <!-- Injected via JS securely -->
        </div>
        
        <!-- EMPTY STATE -->
        <div id="no-reviews-state" style="display: none; text-align: center; padding: 40px 20px; color: #636e72;">
            <span class="material-symbols-outlined" style="font-size: 50px; color: #dfe6e9;">rate_review</span>
            <h4 style="margin: 10px 0 5px 0; color:#1a1a1a;">No reviews yet</h4>
            <p style="font-size: 14px; margin:0;">Be the first to review this product!</p>
        </div>
    </main>

    <!-- WRITE REVIEW BUTTON -->
    <button class="write-review-btn" onclick="openReviewModal()">
        <span class="material-symbols-outlined">edit</span> Write Review
    </button>

    <!-- WRITE REVIEW MODAL -->
    <div class="modal-overlay" id="review-modal">
        <div class="modal-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <h3 style="margin:0; font-size:18px;">Rate this product</h3>
                <span class="material-symbols-outlined" style="cursor:pointer; color:#636e72;" onclick="closeReviewModal()">close</span>
            </div>
            
            <div class="star-input" id="star-selector">
                <span class="material-symbols-outlined" data-val="1">star</span>
                <span class="material-symbols-outlined" data-val="2">star</span>
                <span class="material-symbols-outlined" data-val="3">star</span>
                <span class="material-symbols-outlined" data-val="4">star</span>
                <span class="material-symbols-outlined" data-val="5">star</span>
            </div>

            <textarea class="review-textarea" id="review-text-input" placeholder="What did you like or dislike? (Max 500 chars)"></textarea>
            
            <button class="submit-btn" onclick="handleReviewSubmit()">Submit Review</button>
        </div>
    </div>

    <!-- Master Data File first, then Logic File -->
    <script src="../js/app.js"></script>
    <script src="../js/review.js"></script>
</body>
</html>
