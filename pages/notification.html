<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Notifications - E-KHOKHA</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0" />
    <link rel="stylesheet" href="../css/style.css">
</head>
<body style="background-color: #f8f9fa;">

    <!-- TOP HEADER -->
    <header class="top-header" style="background: #fff; position: fixed; top: 0; width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); z-index: 100;">
        <a href="#" onclick="window.history.back(); return false;" class="header-icon" style="color: #1a1a1a; text-decoration: none; display: flex;">
            <span class="material-symbols-outlined">arrow_back</span>
        </a>
        <div class="header-title" style="font-weight: 700; color: #1a1a1a; font-size: 18px;">Notifications</div>
        <button id="mark-all-btn" onclick="markAllAsRead()" style="background: none; border: none; color: #fd4f6a; font-weight: 600; font-size: 13px; cursor: pointer; visibility: hidden;">Mark all read</button>

    </header>

    <main style="padding: 0px 15px 30px 15px;">
        
        <!-- EMPTY STATE (Rule 9) -->
        <div id="empty-state" style="display: none; flex-direction: column; align-items: center; justify-content: center; height: 60vh; text-align: center;">
            <div style="width: 80px; height: 80px; background: #fff0f2; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-bottom: 20px;">
                <span class="material-symbols-outlined" style="font-size: 40px; color: #fd4f6a;">notifications_off</span>
            </div>
            <h2 style="font-size: 18px; color: #1a1a1a; margin-bottom: 10px;">No notifications yet</h2>
            <p style="color: #636e72; font-size: 14px; max-width: 250px;">We'll notify you when there's something important to share.</p>
        </div>

        <!-- NOTIFICATION LIST -->
        <div id="notification-list" style="display: flex; flex-direction: column; gap: 12px;">
            <!-- JS Inject Karega -->
        </div>

    </main>

    <!-- Scripts -->
    <script src="../js/app.js"></script>
    <script src="../js/notification.js"></script>
</body>
</html>
