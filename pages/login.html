<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Login - E-KHOKHA</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
<link rel="stylesheet" href="../css/style.css">
</head>

<body>

<main class="auth-page">
    <div class="auth-card">

        <div class="auth-brand">
            <h1>E-KHOKHA</h1>
            <p>Welcome back!</p>
        </div>

        <form id="login-form">

            <div class="auth-field">
                <label for="login-email">Email</label>
                <input
                    type="email"
                    id="login-email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="auth-field">
                <label for="login-password">Password</label>

                <div class="password-wrap">
                    <input
                        type="password"
                        id="login-password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                    <button type="button" id="toggle-login-password" class="password-toggle" aria-label="Show password">
                        <span class="material-symbols-outlined">visibility</span>
                    </button>
                </div>
            </div>

            <div class="auth-options">
                <label class="remember-me">
                    <input type="checkbox" id="login-remember">
                    <span>Remember me</span>
                </label>

                <button type="button" id="forgot-password" class="forgot-btn">
                    Forgot Password?
                </button>
            </div>

            <p id="login-error" class="auth-message error" hidden></p>
            <p id="login-success" class="auth-message success" hidden></p>

            <button type="submit" id="login-submit" class="auth-submit">
                Login
            </button>

        </form>

        <div class="auth-divider">
            <span>OR</span>
        </div>

        <p class="auth-switch">
            Don't have an account?
            <a href="signup.html" id="go-signup">Create Account</a>
        </p>

    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>
<script src="../js/auth.js"></script>

</body>
</html>
