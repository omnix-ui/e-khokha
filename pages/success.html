<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Order Success - E-KHOKHA</title>
    
    <!-- Google Material Icons -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    
    <!-- Base CSS & Success Page CSS -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/success.css">
</head>
<body>

    <!-- 1️⃣ SUCCESS HEADER -->
    <header class="success-header">
        <div class="header-title">E-KHOKHA</div>
    </header>

    <!-- 2️⃣ MAIN SUCCESS CONTENT -->
    <main class="success-main">
        
        <div class="success-animation">
            <span class="material-symbols-outlined check-icon">check_circle</span>
        </div>
        
        <h1 class="success-title">Order Placed Successfully!</h1>
        <p class="success-subtitle">Thank you for shopping with us.</p>

        <!-- 3️⃣ ORDER DETAILS CARD -->
        <div class="order-details-card">
            <h3 class="card-title">Order Summary</h3>
            <div class="detail-row">
                <span class="detail-label">Order ID</span>
                <span class="detail-value" id="success-order-id">EKHOKHA-000000</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Amount</span>
                <span class="detail-value font-bold" id="success-amount">₹0</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Payment</span>
                <span class="detail-value text-green">Cash on Delivery</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Deliver To</span>
                <span class="detail-value" id="success-address">Name, Pincode</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Estimated Delivery</span>
                <span class="detail-value" id="success-date">Processing...</span>
            </div>
        </div>

        <!-- 4️⃣ ACTION BUTTONS -->
        <div class="action-buttons">
            <a href="../index.html" class="btn-primary">Continue Shopping</a>
            <!-- Ye page hum aage banayenge -->
            <a href="orders.html" class="btn-secondary">View Order</a> 
        </div>

    </main>

    <!-- Success Page JS -->
    <script src="../js/success.js"></script>
</body>
</html>
