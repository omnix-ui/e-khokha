<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>E-KHOKHA</title>
    
    <!-- Google Material Icons (Modern, clean icons) -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    
    <!-- CSS File Link -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- 1️⃣ STICKY HEADER -->
    <header class="top-header">
        <div class="header-left">
            <span class="material-symbols-outlined">menu</span>
            <div class="logo">E-खोखा</div>
        </div>
        <div class="header-right">
            <!-- 🛒 Yahan cart icon ko 'a' tag me wrap kiya hai taaki click ho sake -->
            <a href="pages/cart.html"class="cart-icon-wrapper" style="text-decoration: none; color: inherit; position: relative;">
                <span class="material-symbols-outlined">shopping_cart</span>
                <!-- Ye badge hai jo app.js se automatic update hoga -->
                <span id="cart-badge" class="cart-badge" style="display: none;">0</span>
            </a>
            <span class="material-symbols-outlined">person</span>
        </div>
    </header>

    <!-- MAIN CONTENT AREA (Baaki phases yahan aayenge) -->
    <main class="main-content">
        
        <!-- 2️⃣ SEARCH BAR -->
        <div class="search-container" onclick="window.location.href='pages/search.html'" style="cursor: pointer;">
            <div class="search-box">
                <span class="material-symbols-outlined">search</span>
                <!-- Readonly lagaya hai kyuki tap karne par search page khulega -->
                <input type="text" placeholder="Search products..." readonly style="cursor: pointer;"> 
            </div>
        </div>

        <!-- 3️⃣ CATEGORIES (Horizontal Scroll) -->
        <div class="categories-section">
            <div class="category-list" id="home-category-list">
                <!-- Javascript will dynamically load categories here -->
            </div>
        </div>

        <!-- 4️⃣ PROMOTIONAL BANNER -->
        <div class="banner-container">
            <div class="promo-banner">
                <div class="banner-content">
                    <h3>BIG SALE</h3>
                    <h2>UP TO 50% OFF</h2>
                    <button class="shop-now-btn">SHOP NOW</button>
                </div>
            </div>
        </div>
        <!-- 5️⃣ FEATURED PRODUCTS -->
        <div class="products-section">
            <h3 class="section-title">Popular Products</h3>
            
            <!-- 🔴 KHALI DABBA: JS YAHAN PRODUCTS LOOP KAREGA -->
            <div class="product-grid" id="home-product-grid">
                <!-- Javascript will generate product cards here -->
            </div>
        </div>

    </main>

    <!-- 6️⃣ BOTTOM NAVIGATION -->
    <nav class="bottom-nav">
        <!-- Home page ke liye index.html -->
        <a href="index.html" class="nav-item active">
            <span class="material-symbols-outlined">home</span>
            <span>Home</span>
        </a>
        <a href="pages/category.html" class="nav-item">
            <span class="material-symbols-outlined">category</span>
            <span>Categories</span>
        </a>
        <!-- 🛒 CART BUTTON LINK (Yahan 'pages/cart.html' laga diya) -->
        <a href="pages/cart.html" class="nav-item">
            <span class="material-symbols-outlined">shopping_cart</span>
            <span>Cart</span>
        </a>
        <!-- Aage ke pages ke links bhi ready kar diye -->
<a href="pages/order.html" class="nav-item">
    <span class="material-symbols-outlined">list_alt</span>
    <span>Order</span>
</a>
        <a href="pages/account.html" class="nav-item">
            <span class="material-symbols-outlined">person</span>
            <span>Account</span>
        </a>
    </nav>

  <script src="js/app.js"></script>
</body>
</html>
